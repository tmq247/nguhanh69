port: 7890
socks-port: 7891
allow-lan: true
mode: rule
log-level: info
external-controller: 127.0.0.1:9090
dns:
  enable: true
  listen: 0.0.0.0:53
  enhanced-mode: redir-host
  nameserver:
    - 8.8.8.8
    - 1.1.1.1

proxies:
  - name: Dante-SOCKS5
    type: socks5
    server: 151.242.170.13
    port: 1080
    udp: true

proxy-groups:
  - name: Telegram
    type: select
    proxies:
      - Dante-SOCKS5

rules:
  - DOMAIN-SUFFIX,t.me,Telegram
  - DOMAIN-SUFFIX,telegram.org,Telegram
  - DOMAIN-KEYWORD,telegram,Telegram
  - MATCH,Dante-SOCKS5
